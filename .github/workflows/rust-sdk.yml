name: Rust SDK
on:
  pull_request:
    paths: ["rust/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust-sdk.yml", "scripts/check_rust_parity.py", "typescript/src/**"]
  push:
    branches: [main]
    paths: ["rust/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust-sdk.yml", "scripts/check_rust_parity.py", "typescript/src/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check API presence parity
        run: python3 scripts/check_rust_parity.py
      - name: Check all targets
        run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test SDK and examples
        if: ${{ !cancelled() }}
        run: cargo +stable test --workspace --all-features --locked
      - name: Build documentation
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps --locked
      - name: Check crate packaging
        if: ${{ !cancelled() }}
        run: cargo +stable package --manifest-path rust/Cargo.toml --locked
  msrv:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install minimum Rust
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Check minimum supported Rust
        run: cargo +1.89.0 check --workspace --all-targets --all-features --locked
