name: Rust SDK
on:
  pull_request:
    paths: ["rust/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust-sdk.yml"]
  push:
    branches: [main]
    paths: ["rust/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust-sdk.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Normalize and record formatting
        run: |
          cargo +stable fmt --all
          python3 - <<'PY'
          import json, pathlib, subprocess
          for p in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines():
              if p.startswith("rust/") and p.endswith(".rs"):
                  print("SENTROY_RUST_FORMAT " + json.dumps({"path": p, "content": pathlib.Path(p).read_text()}, ensure_ascii=True))
          PY
      - name: Check all targets
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test SDK and examples
        run: cargo +stable test --workspace --all-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --all-features --no-deps
      - name: Require committed formatting
        if: always()
        run: git diff --exit-code -- rust
      - name: Check crate packaging
        run: cargo +stable package --manifest-path rust/Cargo.toml --allow-dirty
